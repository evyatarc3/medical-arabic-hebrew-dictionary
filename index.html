const { useState, useMemo } = React;

// --- Audio Configuration ---
// Set this to the base path where audio files are hosted.
// For GitHub Pages: './audio' or 'https://YOUR_USERNAME.github.io/YOUR_REPO/audio'
// For local testing: './audio'
const AUDIO_BASE_PATH = './audio';

// MD5 hash (simplified) to match Python script's file naming
function textToId(text) {
  // Simple hash matching Python's hashlib.md5().hexdigest()[:12]
  let hash = 0;
  for (let i = 0; i < text.length; i++) {
    const chr = text.charCodeAt(i);
    hash = ((hash << 5) - hash) + chr;
    hash |= 0;
  }
  // We use a lookup table approach instead - load manifest.json
  return null;
}

// Audio manifest - loaded from generated manifest.json
let audioManifest = {};
fetch(AUDIO_BASE_PATH + '/manifest.json')
  .then(r => r.ok ? r.json() : {})
  .then(data => { audioManifest = data; })
  .catch(() => { /* Audio not available yet */ });

// Find audio filename for a given Arabic text
function getAudioFile(arabicText) {
  for (const [id, entry] of Object.entries(audioManifest)) {
    if (entry.arabic === arabicText) {
      return AUDIO_BASE_PATH + '/' + entry.filename;
    }
  }
  return null;
}

// Play audio for Arabic text
let currentAudio = null;
function playArabicAudio(arabicText) {
  const audioFile = getAudioFile(arabicText);
  if (!audioFile) return;

  if (currentAudio) {
    currentAudio.pause();
    currentAudio.currentTime = 0;
  }
  currentAudio = new Audio(audioFile);
  currentAudio.play().catch(() => {});
}

// Play button component
function PlayButton({ arabicText, size = 28 }) {
  const [isPlaying, setIsPlaying] = React.useState(false);
  const [hasAudio, setHasAudio] = React.useState(false);

  React.useEffect(() => {
    const check = () => setHasAudio(!!getAudioFile(arabicText));
    check();
    const interval = setInterval(check, 2000);
    return () => clearInterval(interval);
  }, [arabicText]);

  if (!hasAudio) return null;

  const handlePlay = (e) => {
    e.stopPropagation();
    setIsPlaying(true);
    const audioFile = getAudioFile(arabicText);
    if (!audioFile) return;

    if (currentAudio) {
      currentAudio.pause();
      currentAudio.currentTime = 0;
    }
    currentAudio = new Audio(audioFile);
    currentAudio.onended = () => setIsPlaying(false);
    currentAudio.onerror = () => setIsPlaying(false);
    currentAudio.play().catch(() => setIsPlaying(false));
  };

  return React.createElement('button', {
    onClick: handlePlay,
    title: 'השמע בערבית',
    style: {
      background: isPlaying ? 'rgba(233, 69, 96, 0.4)' : 'rgba(233, 69, 96, 0.2)',
      border: '1px solid rgba(233, 69, 96, 0.4)',
      borderRadius: '50%',
      width: size + 'px',
      height: size + 'px',
      display: 'flex',
      alignItems: 'center',
      justifyContent: 'center',
      cursor: 'pointer',
      fontSize: (size * 0.5) + 'px',
      transition: 'all 0.2s ease',
      flexShrink: 0,
    }
  }, isPlaying ? '⏸' : '🔊');
}

function QuizTab({ user }) {
  const [quizState, setQuizState] = React.useState('start'); // start, quiz, results
  const [currentQuestions, setCurrentQuestions] = React.useState([]);
  const [currentIndex, setCurrentIndex] = React.useState(0);
  const [selectedAnswer, setSelectedAnswer] = React.useState(null);
  const [showFeedback, setShowFeedback] = React.useState(false);
  const [score, setScore] = React.useState(0);
  const [answers, setAnswers] = React.useState([]);

  // Generate quiz with bias towards user's profession
  const generateQuiz = () => {
  const userRole = (user && user.role) || 'other';
  const numQuestions = 10;
  
  // Separate questions by relevance to user
  const relevantQuestions = quizQuestions.filter(q =>  
  q.roles.includes(userRole) || q.roles.includes('general')
  );
  const otherQuestions = quizQuestions.filter(q =>  
  !q.roles.includes(userRole) && !q.roles.includes('general')
  );
  
  // Target: 70% relevant, 30% other
  const numRelevant = Math.min(7, relevantQuestions.length);
  const numOther = numQuestions - numRelevant;
  
  // Shuffle and pick
  const shuffleArray = (arr) => {
  const shuffled = [...arr];
  for (let i = shuffled.length - 1; i > 0; i--) {
  const j = Math.floor(Math.random() * (i + 1));
  [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  return shuffled;
  };
  
  const selectedRelevant = shuffleArray(relevantQuestions).slice(0, numRelevant);
  const selectedOther = shuffleArray(otherQuestions).slice(0, numOther);
  
  // Combine and shuffle final set
  const finalQuestions = shuffleArray([...selectedRelevant, ...selectedOther]);
  
  setCurrentQuestions(finalQuestions);
  setCurrentIndex(0);
  setSelectedAnswer(null);
  setShowFeedback(false);
  setScore(0);
  setAnswers([]);
  setQuizState('quiz');
  };

  const handleAnswerSelect = (answerIndex) => {
  if (showFeedback) return;
  setSelectedAnswer(answerIndex);
  };

  const handleSubmitAnswer = () => {
  if (selectedAnswer === null) return;
  
  const currentQ = currentQuestions[currentIndex];
  const isCorrect = selectedAnswer === currentQ.correct;
  
  if (isCorrect) {
  setScore(s => s + 1);
  }
  
  setAnswers([...answers, {
  question: currentQ,
  selected: selectedAnswer,
  correct: isCorrect
  }]);
  
  setShowFeedback(true);
  };

  const handleNextQuestion = () => {
  if (currentIndex < currentQuestions.length - 1) {
  setCurrentIndex(i => i + 1);
  setSelectedAnswer(null);
  setShowFeedback(false);
  } else {
  setQuizState('results');
  }
  };

  const getScoreColor = () => {
  const percentage = (score / currentQuestions.length) * 100;
  if (percentage >= 80) return '#10b981';
  if (percentage >= 60) return '#fbbf24';
  return '#ef4444';
  };

  const getScoreMessage = () => {
  const percentage = (score / currentQuestions.length) * 100;
  if (percentage >= 90) return '🌟 מצוין! שליטה מרשימה בערבית רפואית!';
  if (percentage >= 80) return '👏 כל הכבוד! ביצוע מאוד טוב!';
  if (percentage >= 70) return '👍 טוב מאוד! ממשיכים להתקדם!';

  return '📚 מומלץ לחזור על החומר ולנסות שוב';
  };

  const hebrewLetters = ['א', 'ב', 'ג', 'ד'];

  // Start Screen
  if (quizState === 'start') {

  <br />

  };

  <div style={{ minHeight: '100vh', background: 'linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%)', padding: '20px', fontFamily: 'Segoe UI, Tahoma, Geneva, Verdana, sans-serif' }}>
  <div style={{ maxWidth: '1400px', margin: '0 auto' }}>
  
  {/* Header */}
  <div style={{ textAlign: 'center', marginBottom: '30px', padding: '20px', background: 'rgba(255,255,255,0.1)', borderRadius: '16px', backdropFilter: 'blur(10px)' }}>
  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '15px' }}>
  <div style={{ color: '#94a3b8', fontSize: '14px', textAlign: 'right' }}>
  <span style={{ color: '#10b981' }}>👋 שלום, {user.name}</span>
  <br />
  <span style={{ fontSize: '12px' }}>{currentRole && currentRole.hebrew} | {currentRole && currentRole.arabic}</span>
  </div>
  <button
  onClick={() => setUser(null)}
  style={{
  padding: '8px 16px',
  borderRadius: '8px',
  border: '1px solid rgba(255,255,255,0.2)',
  background: 'transparent',
  color: '#94a3b8',
  cursor: 'pointer',
  fontSize: '13px'
  }}
  >
  התנתק/י
  </button>
  </div>
  <h1 style={{ color: '#fff', fontSize: '2.5rem', marginBottom: '10px', textShadow: '2px 2px 4px rgba(0,0,0,0.3)' }}>
  🩺 לקסיקון רפואי עברית-ערבית
  </h1>
  <p style={{ color: '#94a3b8', fontSize: '1.1rem' }}>
  | האפליקציה נולדה לשמש אנשי רפואה ופרא-רפואה | ייתכנו אי-דיוקים
  </p>
  <p style={{ color: '#fbbf24', fontSize: '0.95rem', marginTop: '8px' }}>
  להערות ניתן ליצור איתי קשר: Evyatarr121@gmail.com | 0546200525 | אביתר
  </p>
  </div>

  {/* Controls */}
  <div style={{ display: 'flex', flexWrap: 'wrap', gap: '15px', marginBottom: '25px', justifyContent: 'center', alignItems: 'center' }}>
  
  {/* Search */}
  <input
  type="text"
  placeholder="🔍 חיפוש בעברית, ערבית או תעתיק..."
  value={searchTerm}
  onChange={(e) => setSearchTerm(e.target.value)}
  style={{
  padding: '12px 20px',
  fontSize: '16px',
  borderRadius: '12px',
  border: '2px solid rgba(255,255,255,0.2)',
  background: 'rgba(255,255,255,0.1)',
  color: '#fff',
  width: '300px',
  outline: 'none'
  }}
  />

  {/* Category Select */}
  <select
  value={selectedCategory}
  onChange={(e) => setSelectedCategory(e.target.value)}
  style={{
  padding: '12px 20px',
  fontSize: '16px',
  borderRadius: '12px',
  border: '2px solid rgba(255,255,255,0.2)',
  background: 'rgba(255,255,255,0.1)',
  color: '#fff',
  cursor: 'pointer'
  }}
  >
  <option value="all" style={{ background: '#1a1a2e' }}>📚 כל הקטגוריות</option>
  {allCategories.map(key => (
  <option key={key} value={key} style={{ background: '#1a1a2e' }}>
  {vocabularyData[key].icon} {vocabularyData[key].title}
  </option>
  ))}
  </select>

  {/* Dialect Select */}
  <select
  value={selectedDialect}
  onChange={(e) => setSelectedDialect(e.target.value)}
  style={{
  padding: '12px 20px',
  fontSize: '16px',
  borderRadius: '12px',
  border: '2px solid rgba(255,255,255,0.2)',
  background: 'rgba(255,255,255,0.1)',
  color: '#fff',
  cursor: 'pointer'
  }}
  >
  <option value="jerusalem" style={{ background: '#1a1a2e' }}>🕌 ניב ירושלמי</option>
  <option value="galilee" style={{ background: '#1a1a2e' }}>🌿 ניב גלילי</option>
  </select>

  {/* Font Size */}
  <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
  <button onClick={() => setFontSize(f => Math.max(12, f - 2))} style={{ padding: '8px 15px', borderRadius: '8px', border: 'none', background: 'rgba(255,255,255,0.2)', color: '#fff', cursor: 'pointer', fontSize: '18px' }}>א-</button>
  <span style={{ color: '#fff' }}>{fontSize}px</span>
  <button onClick={() => setFontSize(f => Math.min(28, f + 2))} style={{ padding: '8px 15px', borderRadius: '8px', border: 'none', background: 'rgba(255,255,255,0.2)', color: '#fff', cursor: 'pointer', fontSize: '18px' }}>א+</button>
  </div>
  </div>

  {/* Tabs */}
  <div style={{ display: 'flex', flexWrap: 'wrap', justifyContent: 'center', gap: '10px', marginBottom: '25px' }}>
  {[
  { id: 'vocabulary', label: '📖 אוצר מילים' },
  { id: 'dialogues', label: '💬 דיאלוגים' },
  { id: 'sentences', label: '📋 מנהלות' },
  { id: 'culture', label: '🌍 כשירות תרבותית' },
  { id: 'quiz', label: '📝 תרגול' }
  ].map(tab => (
  <button
  key={tab.id}
  onClick={() => setActiveTab(tab.id)}
  style={{
  padding: '12px 24px',
  borderRadius: '12px',
  border: 'none',
  background: activeTab === tab.id ? 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)' : 'rgba(255,255,255,0.1)',
  color: '#fff',
  cursor: 'pointer',
  fontSize: '16px',
  fontWeight: activeTab === tab.id ? 'bold' : 'normal',
  transition: 'all 0.3s ease'
  }}
  >
  {tab.label}
  </button>
  ))}
  </div>

  {/* Dialect Note */}
  {selectedDialect === 'jerusalem' && activeTab !== 'culture' && (
  <div style={{ background: 'rgba(251, 191, 36, 0.2)', border: '1px solid #fbbf24', borderRadius: '12px', padding: '12px 20px', marginBottom: '20px', textAlign: 'center' }}>
  <span style={{ color: '#fbbf24' }}>🕌 ניב ירושלמי: האות ק׳ הופכת לעצירה גרונית - למשל: קַלְבּ - אַלְבּ, קָרִיב - אָרִיב</span>
  </div>
  )}

  {/* Culture Tab */}
  {activeTab === 'culture' && (
  <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
  {culturalCompetenceData.map((item) => (
  <div
  key={item.id}
  onClick={() => toggleCard(item.id)}
  style={{
  background: 'rgba(30, 41, 59, 0.9)',
  border: expandedCards[item.id] ? '1px solid #10b981' : '1px solid rgba(51, 65, 85, 0.8)',
  borderRadius: '16px',
  padding: '20px',
  cursor: 'pointer',
  transition: 'all 0.3s ease',
  transform: expandedCards[item.id] ? 'translateY(-2px)' : 'none'
  }}
  >
  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
  <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
  <span style={{ fontSize: '28px' }}>{item.icon}</span>
  <div>
  <h2 style={{ fontWeight: 'bold', fontSize: '18px', color: '#fff', marginBottom: '4px' }}>{item.title}</h2>
  <span style={{ background: '#064e3b', color: '#34d399', fontSize: '12px', padding: '2px 10px', borderRadius: '99px' }}>{item.badge}</span>
  </div>
  </div>
  <span style={{ color: '#64748b', fontSize: '18px', transition: 'transform 0.3s', transform: expandedCards[item.id] ? 'rotate(180deg)' : 'none' }}>â–¼</span>
  </div>
  
  {expandedCards[item.id] && (
  <div style={{ paddingTop: '16px', borderTop: '1px solid rgba(51, 65, 85, 0.8)', marginTop: '16px' }}>
  {Object.entries(item.content).map(([key, section]) => (
  <div key={key} style={{ marginBottom: '14px' }}>
  <p style={{ color: '#94a3b8', fontSize: '14px', lineHeight: '1.7' }}>
  <strong style={{ color: '#10b981' }}>{section.title}:</strong>{' '}
  {section.text || ''}
  </p>
  {section.items && (
  <ul style={{ color: '#94a3b8', fontSize: '14px', lineHeight: '1.8', paddingRight: '20px', marginTop: '8px', listStyleType: 'disc' }}>
  {section.items.map((listItem, idx) => (
  <li key={idx} style={{ marginBottom: '6px' }}>{listItem}</li>
  ))}
  </ul>
  )}
  </div>
  ))}
  </div>
  )}
  </div>
  ))}
  </div>
  )}

  {/* Vocabulary Tab */}
  {activeTab === 'vocabulary' && (
  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(320px, 1fr))', gap: '15px' }}>
  {filteredWords.map((word, idx) => (
  <div key={idx} style={{
  background: 'rgba(255,255,255,0.08)',
  borderRadius: '12px',
  padding: '16px',
  border: '1px solid rgba(255,255,255,0.1)',
  transition: 'all 0.3s ease'
  }}
  onMouseEnter={(e) => e.currentTarget.style.transform = 'translateY(-3px)'}
  onMouseLeave={(e) => e.currentTarget.style.transform = 'translateY(0)'}
  >
  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: '10px' }}>
  <span style={{ color: '#4ade80', fontSize: `${fontSize}px`, fontWeight: 'bold' }}>{word.hebrew}</span>
  <div style={{ display: 'flex', alignItems: 'center', gap: '6px' }}>
  <PlayButton arabicText={word.arabic} size={28} />
  <span style={{ background: 'rgba(255,255,255,0.1)', padding: '3px 8px', borderRadius: '6px', fontSize: '12px', color: '#94a3b8' }}>
  {vocabularyData[word.category] && vocabularyData[word.category].icon}
  </span>
  </div>
  </div>
  <div style={{ color: '#fbbf24', fontSize: `${fontSize + 2}px`, fontFamily: "'Noto Sans Arabic', Arial", direction: 'rtl', marginBottom: '8px' }}>
  {word.arabic}
  </div>
  <div style={{ background: 'rgba(233, 69, 96, 0.15)', padding: '8px 12px', borderRadius: '8px', color: '#f0f0f0', fontSize: `${fontSize - 1}px` }}>
  {getTranscription(word)}
  </div>
  {word.plural && (
  <div style={{ color: '#94a3b8', fontSize: '13px', marginTop: '6px' }}>
  רבים: {word.plural}
  </div>
  )}
  {word.gender && (
  <div style={{ color: '#94a3b8', fontSize: '13px', marginTop: '4px' }}>
  מין: {word.gender}
  </div>
  )}
  {word.notes && (
  <div style={{ color: '#60a5fa', fontSize: '12px', marginTop: '6px', fontStyle: 'italic' }}>
  💡 {word.notes}
  </div>
  )}
  </div>
  ))}
  </div>
  )}

  {/* Dialogues Tab */}
  {activeTab === 'dialogues' && (
  <div style={{ display: 'flex', flexDirection: 'column', gap: '12px' }}>
  {filteredDialogues.map((dialogue, idx) => (
  <div key={idx} style={{
  background: 'rgba(255,255,255,0.08)',
  borderRadius: '12px',
  padding: '16px',
  borderRight: `4px solid ${stageColors[dialogue.stage] || '#666'}`,
  }}>
  <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '10px' }}>
  <span style={{ background: stageColors[dialogue.stage], padding: '4px 12px', borderRadius: '20px', color: '#fff', fontSize: '13px' }}>
  {dialogue.stage}
  </span>
  </div>
  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '15px' }}>
  <div>
  <div style={{ color: '#60a5fa', fontSize: '12px', marginBottom: '4px' }}>👨‍⚕️ רופא:</div>
  <div style={{ color: '#fff', fontSize: `${fontSize}px` }}>{dialogue.doctor}</div>
  </div>
  <div>
  <div style={{ color: '#f472b6', fontSize: '12px', marginBottom: '4px' }}>🧑 מטופל:</div>
  <div style={{ color: '#fff', fontSize: `${fontSize}px` }}>{dialogue.patient}</div>
  </div>
  </div>
  <div style={{ background: 'rgba(233, 69, 96, 0.15)', padding: '10px 14px', borderRadius: '8px', marginTop: '12px', color: '#f0f0f0', fontSize: `${fontSize - 1}px` }}>
  🗣️ {dialogue.transcription}
  </div>
  </div>
  ))}
  </div>
  )}

  {/* Sentences Tab */}
  {activeTab === 'sentences' && (
  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(350px, 1fr))', gap: '12px' }}>
  {filteredSentences.map((sentence, idx) => (
  <div key={idx} style={{
  background: 'rgba(255,255,255,0.08)',
  borderRadius: '12px',
  padding: '14px',
  border: '1px solid rgba(255,255,255,0.1)'
  }}>
  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: '8px' }}>
  <div style={{ color: '#4ade80', fontSize: `${fontSize}px` }}>{sentence.hebrew}</div>
  <PlayButton arabicText={sentence.arabic} size={26} />
  </div>
  <div style={{ color: '#fbbf24', fontSize: `${fontSize + 1}px`, fontFamily: "'Noto Sans Arabic', Arial", direction: 'rtl', marginBottom: '8px' }}>{sentence.arabic}</div>
  <div style={{ background: 'rgba(233, 69, 96, 0.15)', padding: '8px 12px', borderRadius: '8px', color: '#f0f0f0', fontSize: `${fontSize - 1}px` }}>
  {sentence.transcription || sentence.transcriptionJerusalem || ''}
  </div>
  </div>
  ))}
  </div>
  )}

  {/* Quiz Tab */}
  {activeTab === 'quiz' && (
  <QuizTab user={user} />
  )}

  {/* Footer */}
  <div style={{ textAlign: 'center', marginTop: '40px', padding: '20px', color: '#64748b', fontSize: '14px' }}>
  <p>לקסיקון רפואי עברית-ערבית |</p>
  <p>ניב ירושלמי וגלילי</p>
  </div>
  </div>
  </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<ArabicVocabularyApp />);
  </script>
  </body>
</html>
